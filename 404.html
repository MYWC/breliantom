<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>در حال انتقال — Mobilex</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center}.box{text-align:center;padding:28px}.mark{width:48px;height:48px;margin:0 auto 14px;border-radius:14px;background:#111;color:#fff;display:grid;place-items:center;font-weight:800}.title{font-size:28px;margin:0 0 8px}.muted{color:#777;font-size:13px}
  </style>
</head>
<body>
  <main class="box"><div class="mark">M</div><h1 class="title">در حال باز کردن صفحه…</h1><p class="muted">Mobilex</p></main>
  <script>
    (function(){
      try{
        var target=location.pathname+location.search+location.hash;
        sessionStorage.setItem('mobilex-redirect',target);
      }catch(e){}
      var home=location.protocol+'//'+location.host+'/';
      location.replace(home);
    })();
  </script>
</body>
</html>
